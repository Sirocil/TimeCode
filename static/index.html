<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VideoChek — поиск по лекциям</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070b; --panel: #101018; --panel2: #171722; --ink: #e9e9f0; --muted: #7d7f94;
    --yellow: #fcee0a; --cyan: #00f0ff; --red: #ff003c; --line: #2a2a3a; --ok: #3dffb0;
    --head: "Rajdhani", "Bahnschrift", "Arial Narrow", "DejaVu Sans Condensed", sans-serif;
    --mono: "Share Tech Mono", "Consolas", monospace;
    --cut: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 500 16px/1.45 var(--head); display: grid; grid-template-columns: 290px 1fr; grid-template-rows: auto 1fr;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  header { grid-column: 1 / -1; display: flex; gap: 24px; align-items: center; padding: 12px 24px; background: var(--panel); border-bottom: 2px solid var(--yellow); }
  .brand { font: 700 30px var(--head); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; white-space: nowrap; color: var(--yellow); position: relative; }
  .brand::before, .brand::after { content: attr(data-t); position: absolute; left: 0; top: 0; mix-blend-mode: screen; }
  .brand::before { color: var(--cyan); transform: translate(-2px, 0); clip-path: inset(0 0 55% 0); }
  .brand::after { color: var(--red); transform: translate(2px, 0); clip-path: inset(55% 0 0 0); }
  .brand span { position: relative; z-index: 1; }
  #searchForm { flex: 1; display: flex; gap: 10px; max-width: 780px; }
  input[type=text], input[type=search] { flex: 1; padding: 11px 14px; border: 1px solid var(--line); border-bottom: 2px solid var(--cyan); border-radius: 0; background: var(--bg); color: var(--ink); font: 500 16px var(--mono); }
  input::placeholder { color: var(--muted); }
  button { padding: 11px 20px; border: 0; background: var(--yellow); color: #000; font: 700 16px var(--head); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; clip-path: var(--cut); }
  button:hover:not(:disabled) { background: var(--cyan); }
  button:disabled { opacity: .5; cursor: wait; }
  aside { border-right: 1px solid var(--line); padding: 18px; overflow: auto; background: var(--panel); }
  aside h2 { font: 700 14px var(--head); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); margin: 20px 0 10px; }
  .upload { display: grid; gap: 8px; }
  .upload input[type=file] { font: 13px var(--mono); color: var(--muted); }
  .lec { padding: 10px 12px; cursor: pointer; border-left: 3px solid var(--line); margin-bottom: 4px; }
  .lec:hover { background: var(--panel2); border-left-color: var(--cyan); }
  .lec.active { background: var(--panel2); border-left-color: var(--yellow); }
  .lec b { display: block; font-weight: 700; font-size: 17px; }
  .st { font: 13px var(--mono); color: var(--muted); }
  .st.ready { color: var(--ok); } .st.error { color: var(--red); }
  main { overflow: auto; padding: 24px; }
  .empty { max-width: 560px; margin: 12vh auto; text-align: center; color: var(--muted); }
  .empty h1 { font: 700 40px var(--head); letter-spacing: .06em; text-transform: uppercase; color: var(--yellow); margin: 0 0 8px; }
  .hit { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--cyan); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; clip-path: var(--cut); }
  .hit:hover { border-left-color: var(--yellow); background: var(--panel2); }
  .hit .meta { display: flex; gap: 14px; font: 13px var(--mono); color: var(--muted); margin-bottom: 4px; align-items: center; }
  .hit .meta b { font: 700 17px var(--head); color: var(--ink); }
  .tc { color: var(--yellow); font: 700 15px var(--mono); font-variant-numeric: tabular-nums; }
  .lecture { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 1000px) { .lecture { grid-template-columns: 1fr; } body { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; } }
  video { width: 100%; background: #000; display: block; border: 1px solid var(--line); clip-path: var(--cut); }
  .sub { min-height: 60px; margin-top: 10px; padding: 12px 16px; background: var(--panel); border-left: 4px solid var(--yellow); font: 500 19px/1.4 var(--head); }
  h1.title { font: 700 30px var(--head); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 14px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tabs button { background: transparent; color: var(--muted); clip-path: none; padding: 8px 14px; border-bottom: 2px solid var(--line); }
  .tabs button.on { color: var(--yellow); border-bottom-color: var(--yellow); }
  .tabs button:hover { background: transparent; color: var(--cyan); }
  .panel { background: var(--panel); border: 1px solid var(--line); max-height: 70vh; overflow: auto; }
  .seg { display: flex; gap: 12px; padding: 8px 14px; cursor: pointer; border-left: 3px solid transparent; }
  .seg:hover { background: var(--panel2); }
  .seg.now { background: rgba(252,238,10,.12); border-left-color: var(--yellow); }
  .toc { padding: 14px; }
  .toc p { margin: 0 0 14px; color: var(--ink); }
  .toc .sec { display: flex; gap: 12px; padding: 6px 0; cursor: pointer; }
  .toc .sec:hover span:last-child { color: var(--cyan); }
  .hint { color: var(--muted); font: 14px var(--mono); padding: 14px; }
</style>
</head>
<body>
<header>
  <div class="brand" id="home" data-t="VideoChek"><span>VideoChek</span></div>
  <form id="searchForm">
    <input type="search" id="q" placeholder="Что вы ищете? Например: как решать в столбик" aria-label="Поиск по смыслу">
    <button type="submit">Найти</button>
  </form>
</header>

<aside>
  <h2>Загрузить в базу</h2>
  <form class="upload" id="upForm">
    <input type="file" id="file" accept="video/mp4,video/webm,video/*">
    <input type="text" id="url" placeholder="или ссылка на YouTube / Vimeo">
    <input type="text" id="title" placeholder="Название (необязательно)">
    <button type="submit">Загрузить</button>
  </form>
  <h2>Архив лекций</h2>
  <div id="list"></div>
</aside>

<main id="main"></main>

<script>
const $ = (s) => document.querySelector(s);
const STATUS = { queued: "В очереди", extracting: "Извлекаем звук…", transcribing: "Распознаём речь…",
  indexing: "Строим индекс…", summarizing: "Пишем конспект…", ready: "Готово", error: "Ошибка" };
const fmt = (t) => { t = Math.floor(t); const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (url, opts) => { const r = await fetch(url, opts); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText); return r.json(); };

let lectures = [], current = null, pollTimer = null;

async function loadList() {
  lectures = await api("/api/lectures");
  $("#list").innerHTML = lectures.length ? lectures.map((l) => `
    <div class="lec ${current?.id === l.id ? "active" : ""}" data-id="${l.id}">
      <b>${esc(l.title)}</b>
      <span class="st ${l.status}">${STATUS[l.status] || l.status}${l.duration ? " · " + fmt(l.duration) : ""}</span>
    </div>`).join("") : `<div class="hint">Пока нет лекций. Загрузите первую.</div>`;
  clearTimeout(pollTimer);
  if (lectures.some((l) => !["ready", "error"].includes(l.status))) pollTimer = setTimeout(loadList, 3000);
}

function home() {
  current = null; location.hash = "";
  $("#main").innerHTML = `<div class="empty"><h1>Найди момент в лекции</h1>
    <p>Опишите, что вы хотите услышать, своими словами. Мы найдём фрагменты по смыслу и откроем видео с нужной секунды.</p></div>`;
  loadList();
}

async function openLecture(id, t = 0) {
  const l = await api("/api/lectures/" + id);
  current = l; loadList();
  const ready = l.status === "ready";
  $("#main").innerHTML = `
    <h1 class="title">${esc(l.title)}</h1>
    <div class="lecture">
      <div>
        <video id="v" src="/video/${l.id}" controls preload="metadata"></video>
        <div class="sub" id="sub">${ready ? "" : "Обработка: " + (STATUS[l.status] || l.status)}</div>
      </div>
      <div>
        <div class="tabs"><button class="on" data-tab="tr">Транскрипт</button><button data-tab="sm">Конспект</button></div>
        <div class="panel" id="panel"></div>
      </div>
    </div>`;
  const v = $("#v"), panel = $("#panel");
  const seek = (s) => { v.currentTime = s; v.play(); };
  const showTr = () => {
    panel.innerHTML = l.transcript.length ? l.transcript.map((s, i) =>
      `<div class="seg" data-i="${i}" data-t="${s.start}"><span class="tc">${fmt(s.start)}</span><span>${esc(s.text)}</span></div>`).join("")
      : `<div class="hint">Транскрипт появится после обработки видео.</div>`;
  };
  const showSm = () => {
    panel.innerHTML = l.summary || l.outline.length ? `<div class="toc"><p>${esc(l.summary)}</p>` +
      l.outline.map((o) => `<div class="sec" data-t="${o.start}"><span class="tc">${fmt(o.start)}</span><span>${esc(o.title)}</span></div>`).join("") + `</div>`
      : `<div class="hint">Конспект появится после обработки видео.</div>`;
  };
  showTr();
  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
    b.dataset.tab === "tr" ? showTr() : showSm();
  });
  panel.onclick = (e) => { const el = e.target.closest("[data-t]"); if (el) seek(+el.dataset.t); };

  let last = -1;
  v.ontimeupdate = () => {   // субтитры синхронно с воспроизведением
    const i = l.transcript.findIndex((s) => v.currentTime >= s.start && v.currentTime < s.end);
    if (i === last) return; last = i;
    $("#sub").textContent = i >= 0 ? l.transcript[i].text : "";
    document.querySelectorAll(".seg.now").forEach((x) => x.classList.remove("now"));
    const row = document.querySelector(`.seg[data-i="${i}"]`);
    if (row) { row.classList.add("now"); row.scrollIntoView({ block: "nearest" }); }
  };
  if (t) v.addEventListener("loadedmetadata", () => seek(t), { once: true });
  if (!ready && l.status !== "error") setTimeout(() => current?.id === id && openLecture(id), 4000);
}

async function search(q) {
  $("#main").innerHTML = `<div class="hint">Ищем…</div>`;
  try {
    const res = await api("/api/search?q=" + encodeURIComponent(q));
    $("#main").innerHTML = res.length ? `<div style="max-width:820px">` + res.map((r) => `
      <div class="hit" data-id="${r.lecture_id}" data-t="${r.start}">
        <div class="meta"><b>${esc(r.title)}</b><span class="tc">${fmt(r.start)}</span><span>совпадение ${Math.round(r.score * 100)}%</span></div>
        <div>${esc(r.text)}</div></div>`).join("") + `</div>`
      : `<div class="empty"><p>Ничего не нашли. Попробуйте переформулировать запрос или дождитесь конца обработки лекций.</p></div>`;
  } catch (e) { $("#main").innerHTML = `<div class="hint">Ошибка поиска: ${esc(e.message)}</div>`; }
}

$("#home").onclick = home;
$("#list").onclick = (e) => { const el = e.target.closest(".lec"); if (el) openLecture(el.dataset.id); };
$("#main").onclick = (e) => { const el = e.target.closest(".hit"); if (el) openLecture(el.dataset.id, +el.dataset.t); };
$("#searchForm").onsubmit = (e) => { e.preventDefault(); const q = $("#q").value.trim(); if (q) search(q); };
$("#upForm").onsubmit = async (e) => {
  e.preventDefault();
  const fd = new FormData();
  if ($("#file").files[0]) fd.append("file", $("#file").files[0]);
  fd.append("url", $("#url").value); fd.append("title", $("#title").value);
  const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Загружаем…";
  try { const { id } = await api("/api/lectures", { method: "POST", body: fd }); e.target.reset(); await openLecture(id); }
  catch (err) { alert("Не получилось: " + err.message); }
  btn.disabled = false; btn.textContent = "Загрузить";
};

home();
</script>
</body>
</html>
